<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 Casino Party Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu Screen -->
    <div id="menu-screen" class="screen active">
        <div class="container">
            <h1 class="title">🎰 CASINO PARTY GAMES</h1>
            <p class="subtitle">เลือกเกมที่อยากเล่น</p>

            <div class="game-grid">
                <button class="game-card pirate" onclick="startGame('pirate')">
                    <div class="game-icon">🏴‍☠️</div>
                    <div class="game-name">PIRATE BARREL</div>
                    <div class="game-desc">ลากดาบเสียบถัง</div>
                </button>

                <button class="game-card crocodile" onclick="startGame('crocodile')">
                    <div class="game-icon">🐊</div>
                    <div class="game-name">CROCODILE DENTIST</div>
                    <div class="game-desc">กดฟันจระเข้</div>
                </button>

                <button class="game-card cards" onclick="startGame('cards')">
                    <div class="game-icon">🃏</div>
                    <div class="game-name">PARTY POKER</div>
                    <div class="game-desc">ลากไพ่จั่ว</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Pirate Game Screen -->
    <div id="pirate-screen" class="screen">
        <button class="back-btn" onclick="backToMenu()">← กลับ</button>

        <div class="game-container">
            <h2 class="game-title">🏴‍☠️ PIRATE BARREL</h2>
            <p class="game-instruction">ลากดาบไปวางบนถัง!</p>

            <!-- Barrel -->
            <div class="barrel-container">
                <div id="barrel" class="barrel">
                    <div class="pirate-face" id="pirate-face">😴</div>
                    <!-- Slots for swords -->
                    <div class="barrel-slots">
                        <div class="barrel-slot" data-slot="0"></div>
                        <div class="barrel-slot" data-slot="1"></div>
                        <div class="barrel-slot" data-slot="2"></div>
                        <div class="barrel-slot" data-slot="3"></div>
                        <div class="barrel-slot" data-slot="4"></div>
                        <div class="barrel-slot" data-slot="5"></div>
                        <div class="barrel-slot" data-slot="6"></div>
                        <div class="barrel-slot" data-slot="7"></div>
                    </div>
                </div>
            </div>

            <!-- Swords -->
            <div class="swords-container" id="swords-container">
                <div class="sword draggable" draggable="true" data-sword="0">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="1">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="2">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="3">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="4">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="5">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="6">🗡️</div>
                <div class="sword draggable" draggable="true" data-sword="7">🗡️</div>
            </div>

            <div class="game-message" id="pirate-message">ลากดาบไปวางบนถัง!</div>
            <button class="reset-btn" onclick="resetPirate()">🔄 เริ่มใหม่</button>
        </div>
    </div>

    <!-- Crocodile Game Screen -->
    <div id="crocodile-screen" class="screen">
        <button class="back-btn" onclick="backToMenu()">← กลับ</button>

        <div class="game-container">
            <h2 class="game-title">🐊 CROCODILE DENTIST</h2>
            <p class="game-instruction">กดฟันทีละอัน อย่าให้ปากกัด!</p>

            <div class="croc-container">
                <div class="croc-head" id="croc-head">
                    <div class="croc-emoji">🐊</div>
                </div>

                <div class="teeth-grid">
                    <button class="tooth" onclick="pressTooth(0)">🦷</button>
                    <button class="tooth" onclick="pressTooth(1)">🦷</button>
                    <button class="tooth" onclick="pressTooth(2)">🦷</button>
                    <button class="tooth" onclick="pressTooth(3)">🦷</button>
                    <button class="tooth" onclick="pressTooth(4)">🦷</button>
                    <button class="tooth" onclick="pressTooth(5)">🦷</button>
                    <button class="tooth" onclick="pressTooth(6)">🦷</button>
                    <button class="tooth" onclick="pressTooth(7)">🦷</button>
                    <button class="tooth" onclick="pressTooth(8)">🦷</button>
                    <button class="tooth" onclick="pressTooth(9)">🦷</button>
                    <button class="tooth" onclick="pressTooth(10)">🦷</button>
                    <button class="tooth" onclick="pressTooth(11)">🦷</button>
                </div>
            </div>

            <div class="game-message" id="croc-message">กดฟันทีละอัน!</div>
            <button class="reset-btn" onclick="resetCrocodile()">🔄 เริ่มใหม่</button>
        </div>
    </div>

    <!-- Card Game Screen -->
    <div id="cards-screen" class="screen">
        <button class="back-btn" onclick="backToMenu()">← กลับ</button>

        <div class="game-container">
            <h2 class="game-title">🃏 PARTY POKER</h2>
            <p class="game-instruction">ลากไพ่จากกอง!</p>

            <div class="card-game-area">
                <!-- Card Deck -->
                <div class="card-deck-container">
                    <div id="card-deck" class="card-deck">
                        <div class="card card-back" draggable="true" id="top-card">
                            <div class="card-back-design">🃏</div>
                        </div>
                        <div class="deck-count">เหลือ: <span id="deck-count">52</span> ใบ</div>
                    </div>
                </div>

                <!-- Drop Zone -->
                <div id="card-drop-zone" class="card-drop-zone">
                    <div class="drop-zone-text">ลากไพ่มาวางที่นี่</div>
                </div>
            </div>

            <div class="game-message" id="card-message"></div>
            <button class="reset-btn" onclick="resetCards()">🔄 สับไพ่ใหม่</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
